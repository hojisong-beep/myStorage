    if (t < N.sit[1]) { J.mode = 'nap'; J.eyes = 'squint'; J.sq = 0.16 * Math.sin(Math.PI * seg(t, N.sit[0], N.sit[1])); return J; }   // 웅크리며 눕기
    if (t < N.wake[0]) { J.mode = 'nap'; J.eyes = 'sleep'; J.sq = -0.035 * Math.sin(t * 2.4); J.wag = 0.25; return J; }
    if (t < N.wake[1]) { const u = seg(t, N.wake[0], N.wake[1]); J.mode = 'nap'; J.eyes = u < 0.45 ? 'sleep' : 'open'; J.sq = -0.05 * Math.sin(u * 6); return J; }
    J.mode = 'front'; J.up = 0; J.eyes = 'open'; J.look = [0, 0.1]; return J;
  }
  if (t < TT.walk3[1]) { const u = smooth(seg(t, TT.walk3[0], TT.walk3[1])), p = posAt(PATHS[3], u); J.mode = 'side'; J.fx = p.x; J.fy = p.y - Math.abs(Math.sin(t * 11)) * 4; J.gy = p.y; J.dir = dirAt(PATHS[2], u); J.walk = 1; J.ph = t * 11; return J; }
  if (t < TT.walk4[0]) {      // 일어서서 놀아 주세요
    const p = PATHS[3].pts[PATHS[3].pts.length - 1]; J.mode = 'front'; J.fx = p[0]; J.fy = p[1];
    const up = smooth(seg(t, TT.standUp[0], TT.standUp[1])) * (1 - smooth(seg(t, TT.sitDown[0], TT.sitDown[1])));
    J.up = up; J.eyes = 'wide'; J.look = [0, -1]; J.wag = 1;
    if (t >= TT.standUp[1]) { const k = smooth(seg(t, TT.standUp[1], TT.standUp[1] + 0.3)), ph = Math.sin(t * 10); J.sq = 0.05 * k * ph; J.fy -= k * 9 * (0.5 + 0.5 * ph); }   // 몸이 위아래로 들썩
    if (t >= TT.standUp[1] && t < TT.wave[1]) { const k = smooth(seg(t, TT.standUp[1], TT.standUp[1] + 0.3)) * (1 - smooth(seg(t, TT.wave[1] - 0.2, TT.wave[1] + 0.2))); J.beg = k; J.begY = -32 * Math.sin(t * 10) * k; }   // 두 발을 모아 앞으로 내밀고 아래위로
    return J;
  }
  if (t < TT.walk4[1]) { const u = smooth(seg(t, TT.walk4[0], TT.walk4[1])), p = posAt(PATHS[4], u); J.mode = 'side'; J.fx = p.x; J.fy = p.y - Math.abs(Math.sin(t * 11)) * 4; J.gy = p.y; J.dir = dirAt(PATHS[3], u); J.walk = 1; J.ph = t * 11; return J; }
  if (t < TT.orbit[0]) { const p = PATHS[4].pts[PATHS[4].pts.length - 1]; J.fx = p[0]; J.fy = p[1]; J.eyes = 'wide'; J.look = [1, -0.4]; return J; }
  if (t < TT.orbit[1]) {
    const th = ORB.w * (t - TT.orbit[0]) + Math.PI, p = orbPos(th), hh = jeroBounceH(t), dx = -ORB.rx * Math.sin(th);
    J.mode = 'side'; J.fx = p[0]; J.gy = p[1]; J.fy = p[1] - hh; J.dir = dx >= 0 ? 1 : -1;
    const u = hh / 90; J.air = u * 0.9; J.sq = -0.1 * u; J.walk = 0.3; J.ph = t * 14;
    const swipe = 0.5 + 0.5 * Math.sin(t * 13); J.reach = u > 0.15 ? swipe : 0; J.reachTo = [118, -112]; J.eyes = 'wide'; J.look = [J.dir, -0.8];
    const lt = (t - TT.orbit[0]) % 0.8; if (lt < 0.1) J.sq = 0.22 * (1 - lt / 0.1); // 착지
    return J;
  }
  if (t < TT.leap[1]) {
    const th0 = ORB.w * (TT.orbit[1] - TT.orbit[0]) + Math.PI, a = orbPos(th0), g = girlState(t), chest = [g.fx, g.fy - HUGY];
    const to = [chest[0], chest[1] + 53], u = smooth(seg(t, TT.leap[0], TT.leap[1]));
    J.mode = 'front'; J.hs = lerp(1, 0.62, u); J.fx = lerp(a[0], to[0], u); J.gy = lerp(a[1], to[1], u); J.fy = lerp(a[1], to[1], u) - 120 * 4 * u * (1 - u) * (1 - u * 0.2);
    J.up = 0.55; J.eyes = 'wide'; J.hug = u * 0.6; J.look = [0, -0.3]; J.shadow = 0; return J;
  }
  if (t < TT.hopOut[0]) {
    const g = girlState(t), lift = 24 * smooth(seg(t, TT.hugHold[0], TT.hugHold[1] - 0.7)), chest = [g.fx, g.fy - HUGY - lift];
    J.mode = 'front'; J.hs = 0.62; J.fx = chest[0]; J.fy = chest[1] + 53; J.up = 0.5; J.hug = 1; J.eyes = 'happy'; J.mouth = 'smile'; J.shadow = 0; J.sq = 0.03 * Math.sin(t * 8); return J;
  }
  if (t < TT.hopOut[1]) {
    const g = girlState(t), from = [g.fx, g.fy - HUGY + 53 - 24], u = seg(t, TT.hopOut[0], TT.hopOut[1]), to = [620, 4672];
    J.mode = 'front'; J.hs = lerp(0.62, 1, smooth(u)); J.fx = lerp(from[0], to[0], u); J.gy = lerp(from[1] + 40, to[1], u); J.fy = lerp(from[1], to[1], u) - 150 * 4 * u * (1 - u); J.up = 0.4 * (1 - u); J.eyes = 'open'; J.hug = 1 - u; J.shadow = u; return J;
  }
  J.mode = 'front'; J.fx = 620; J.fy = 4672; J.sq = 0; J.look = [0, 0.1];
  { const d = t - TT.hopOut[1]; if (d < 0.5) J.sq = 0.26 * Math.exp(-d * 8) * Math.cos(d * 13); }
  return J;
}

/* =====================================================================
   여자아이 (단순한 연필 선 인물)
   ===================================================================== */
function drawGirl(ctx, g, t, front) {
  if (!g.vis) return;
  const X = (x, y) => [g.fx + x, g.fy + y];
  const P = a => a.map(p => X(p[0], p[1]));
  const part = (poly, id, fill, o) => pencil(ctx, P(poly), Object.assign({ seed: id, closed: true, fill, w: 4 }, o || {}));
  const st = g.stride, air = g.jump > 4 ? 1 : 0;
  if (!front) {
    pencil(ctx, ellipsePts(g.fx, g.fy + g.jump + 3, 56, 10, 14), { seed: 'gshadow', closed: true, fill: C.furShade, fa: 0.5, line: false });
    // 다리 + 신발
    [-1, 1].forEach((sg, i) => {
      const fx = sg * 17 + st * sg * 0.9, fy = -12 - (st * sg > 6 ? 8 : 0) - air * 10;
      part(capsule([sg * 14, -98], [fx, fy], 7.5), 'g_leg' + i, C.skin);
      part(ellipsePts(fx + sg * 3, fy + 8, 17, 9, 12), 'g_shoe' + i, C.shoe);
    });
    // 원피스
    part([[-30, -190], [30, -190], [54, -92], [-54, -92]], 'g_dress', C.dress);
    pencil(ctx, P([[-50, -98], [-40, -88], [-28, -98], [-14, -88], [0, -98], [14, -88], [28, -98], [40, -88], [50, -98]]), { seed: 'g_hem', w: 3 });
    // 팔(왼쪽은 흔들기, 오른쪽은 깃털 막대)
    const armLy = -150 + g.armA * 14 + (g.wand ? Math.sin(t * 8) * 6 : 0);
    part(capsule([-30, -182], [-44 - g.armA * 6, armLy], 7), 'g_armL', C.skin);
    // 머리
    part([[50, -228], [50, -200], [40, -192], [-40, -192], [-50, -200], [-50, -228], [-44, -258], [-22, -278], [22, -278], [44, -258]], 'g_hairb', C.hair);
    part(ellipsePts(0, -230, 38, 40, 22), 'g_head', C.skin);
    part([[-40, -232], [-33, -262], [0, -272], [33, -262], [40, -232], [26, -248], [8, -240], [-10, -248], [-26, -240]], 'g_fringe', C.hair);
    [-1, 1].forEach((sg, i) => { part(ellipsePts(sg * 14, -226, 3.2, 3.8, 8), 'g_eye' + i, C.ink, { line: false }); part(ellipsePts(sg * 25, -214, 7, 4.5, 8), 'g_blush' + i, C.dress, { line: false, fa: 0.6 }); });
    pencil(ctx, P([[-9, -212], [0, -206], [9, -212]]), { seed: 'g_smile', w: 3 });
    // 깃털 장난감 막대
    if (g.wand) {
      const hand = X(40 * -g.wandDir * -1 * -1 + 0, -150); // 오른팔(화면 기준 wandDir 방향)
      const hx = g.fx + g.wandDir * 42, hy = g.fy - 152 + Math.sin(t * 8) * 8;
      part(capsule([g.wandDir * 30, -182], [g.wandDir * 42, -152 + Math.sin(t * 8) * 8], 7), 'g_armR', C.skin);
      const tip = [hx + g.wandDir * 105 + Math.sin(t * 8) * 38 * -g.wandDir, hy - 92 + Math.cos(t * 8) * 14];
      g.tip = tip;
      pencil(ctx, [[hx, hy], tip], { seed: 'g_wand', w: 4, color: C.maskDark });
      [-1, 0, 1].forEach((k, i) => pencil(ctx, [[tip[0], tip[1]], [tip[0] + k * 22 + 4, tip[1] - 30 - Math.abs(k) * -4]], { seed: 'g_fea' + i, w: 4.5, color: i === 1 ? C.dress : C.leaf }));
      pencil(ctx, [[tip[0], tip[1]], [tip[0] - 5, tip[1] - 38]], { seed: 'g_fea3', w: 3, color: C.dress });
    } else if (g.hug < 0.05) {
      part(capsule([30, -182], [46 + g.armA * 8, -150 - g.armA * 20], 7), 'g_armR', C.skin);
    }
  } else {
    // 안아 올리는 팔 (제로 위에 겹쳐 그림)
    if (g.hug > 0.05) {
      const k = g.hug, ch = [0, -HUGY - (g.hugLift || 0)];
      part(capsule([-30, -182], [lerp(-44, -30, k), lerp(-150, ch[1] + 38, k)], 7.5), 'g_hugL', C.skin);
      part(capsule([30, -182], [lerp(44, 30, k), lerp(-150, ch[1] + 38, k)], 7.5), 'g_hugR', C.skin);
    }
  }
}

/* =====================================================================
   효과: 먼지 선, 하트, 반짝임, 말풍선 낙서
   ===================================================================== */
const DUST = [
  [1.5, 'j'], [4.45, 'j'], [5.65, 'j'], [6.4, 'j'], [7.15, 'j'],
  [16.6, 'j'], [17.4, 'j'], [18.2, 'j'], [19.0, 'j'], [16.2, 'g'], [17.0, 'g'], [17.8, 'g'], [18.6, 'g'], [21.2, 'j']
].map(d => [d[0] > CONFIG.NAP.from ? d[0] + CONFIG.NAP.len : d[0], d[1]]);
function drawDust(ctx, t) {
  DUST.forEach((d, i) => {
    const age = t - d[0]; if (age < 0 || age > 0.45) return;
    const s = d[1] === 'j' ? jeroState(d[0] + 0.001) : girlState(d[0] + 0.001);
    const x = s.fx, y = d[1] === 'j' ? (s.gy === null ? s.fy : s.gy) : s.fy + (s.jump || 0), p = age / 0.45;
    [-155, -90, -25].forEach((deg, k) => {
      const a = deg * Math.PI / 180, r0 = 20 + 18 * p, r1 = r0 + 22 * (1 - p * 0.4);
      pencil(ctx, [[x + Math.cos(a) * r0 * 1.5, y - 4 + Math.sin(a) * r0], [x + Math.cos(a) * r1 * 1.5, y - 4 + Math.sin(a) * r1]], { seed: 'dust' + i + k, w: 3.2, color: C.mask, a: 1 - p * p, p: 1, step: 20 });
    });
  });
}
function heartPoly(cx, cy, s) { const pts = []; for (let i = 0; i < 26; i++) { const a = i / 26 * Math.PI * 2; pts.push([cx + 16 * Math.pow(Math.sin(a), 3) * s / 16 * 16, cy - (13 * Math.cos(a) - 5 * Math.cos(2 * a) - 2 * Math.cos(3 * a) - Math.cos(4 * a)) * s]); } return pts; }
function drawHeart(ctx, cx, cy, s, seed, a, rot) { pencil(ctx, heartPoly(cx, cy, s), { seed, closed: true, fill: C.mouth, w: 3.5, a }); }
function drawPaw(ctx, x, y, s, seed, a) {
  pencil(ctx, ellipsePts(x, y + 8 * s, 15 * s, 11 * s, 12), { seed: seed + 'p', closed: true, fill: C.mask, w: 3, a });
  [[-17, -8], [-6, -19], [6, -19], [17, -8]].forEach((q, i) => pencil(ctx, ellipsePts(x + q[0] * s, y + q[1] * s, 6 * s, 7.5 * s, 8), { seed: seed + i, closed: true, fill: C.mask, w: 3, a }));
}
function sparkle(ctx, x, y, r, seed, a, rot) {
  const ln = (ang, rr) => [[x - Math.cos(ang) * rr, y - Math.sin(ang) * rr], [x + Math.cos(ang) * rr, y + Math.sin(ang) * rr]];
  pencil(ctx, ln(rot, r), { seed: seed + 'a', w: 3.5, color: C.ink, a }); pencil(ctx, ln(rot + Math.PI / 2, r), { seed: seed + 'b', w: 3.5, color: C.ink, a });
  pencil(ctx, ln(rot + Math.PI / 4, r * 0.5), { seed: seed + 'c', w: 3, color: C.holeRim, a }); pencil(ctx, ln(rot - Math.PI / 4, r * 0.5), { seed: seed + 'd', w: 3, color: C.holeRim, a });
}
function drawFx(ctx, t) {
  drawDust(ctx, t);
  // 먹는 동안 떠오르는 하트
  [0, 1, 2].forEach(i => {
    const t0 = TT.hearts[0] + i * 0.35, age = t - t0; if (age < 0 || age > 1.5) return;
    const u = age / 1.5, x = 600 + i * 46 + Math.sin(u * 6 + i) * 10, y = 1770 - 120 * u;
    drawHeart(ctx, x, y, 1.1 + i * 0.15, 'eh' + i, Math.sin(Math.PI * Math.min(1, u * 1.1)) * 1);
  });
  // 낮잠: 떠오르는 Z
  { const N = CONFIG.NAP;
    if (t >= N.sleep[0] + 0.2 && t < N.wake[0] + 0.3) {
      const j = jeroState(Math.min(t, N.wake[0] - 0.01));
      for (let i = 0; i < 3; i++) {
        const age = ((t - N.sleep[0] + i * 0.6) % 1.8 + 1.8) % 1.8, u = age / 1.8, sz = 12 + 9 * u, x = j.fx + 45 - u * 75, y = j.fy - 95 - u * 125, a = Math.sin(Math.PI * u) * (t > N.wake[0] ? 1 - (t - N.wake[0]) / 0.3 : 1);
        pencil(ctx, [[x - sz, y - sz], [x + sz, y - sz], [x - sz, y + sz], [x + sz, y + sz]], { seed: 'zz' + i, w: 4, a, step: 12 });
      }
    } }
  // ③→④ 말풍선 낙서
  if (t >= TT.bubbles[0] && t < TT.bubbles[1] + 0.3) {
    const base = PATHS[3].pts[PATHS[3].pts.length - 1], fade = 1 - seg(t, TT.bubbles[1] - 0.2, TT.bubbles[1] + 0.2);
    [[TT.bubbles[0], 'heart', 110, -330], [TT.bubbles[0] + 0.4, 'paw', -150, -390], [TT.bubbles[0] + 0.8, 'heart', 40, -470]].forEach((b, i) => {
      const age = t - b[0]; if (age < 0) return;
      const sc = easeOutBack(age / 0.3) , x = base[0] + b[2], y = base[1] + b[3] - 12 * age, r = 40 * sc;
      pencil(ctx, ellipsePts(x, y, r, r * 0.86, 20), { seed: 'bub' + i, closed: true, fill: C.white, fa: 0.7, w: 3.5, a: fade });
      pencil(ctx, ellipsePts(x - r * 0.9, y + r * 1.0, r * 0.14, r * 0.14, 8), { seed: 'bubd' + i, closed: true, w: 3, a: fade });
      pencil(ctx, ellipsePts(x - r * 0.6, y + r * 0.85, r * 0.22, r * 0.2, 8), { seed: 'bubd2' + i, closed: true, w: 3, a: fade });
      if (b[1] === 'heart') drawHeart(ctx, x, y + 3, 1.05 * sc, 'bh' + i, fade); else drawPaw(ctx, x, y - 4, 0.95 * sc, 'bp' + i, fade);
    });
  }
  // ④ 안겼을 때 반짝임과 하트
  if (t >= TT.leap[1] - 0.1 && t < TT.hopOut[0] + 0.2) {
    const g = girlState(t), cx = g.fx, cy = g.fy - 190;
    for (let i = 0; i < 7; i++) {
      const t0 = TT.leap[1] - 0.1 + i * 0.16, age = t - t0; if (age < 0) continue;
      const ang = i * 2.4 + 0.5, rad = 120 + (i % 3) * 22, x = cx + Math.cos(ang) * rad * 1.1, y = cy + Math.sin(ang) * rad * 0.8 - 14 * Math.min(age, 1.2);
      const aa = Math.min(1, age / 0.2) * (t > TT.hopOut[0] ? 1 - (t - TT.hopOut[0]) / 0.2 : 1);
      if (i % 2) drawHeart(ctx, x, y, 0.95, 'sh' + i, aa); else sparkle(ctx, x, y, 20 + (i % 3) * 4, 'sp' + i, aa, age * 2 + i);
    }
  }
}

/* =====================================================================
   장면 합치기
   ===================================================================== */
function scene(ctx, t) {
  G.v = ((Math.floor(t * 12) % 3) + 3) % 3;
  const cam = camAt(t);
  drawBackdrop(ctx, cam);
  drawPaper(ctx, cam);
  ctx.setTransform(cam.z, 0, 0, cam.z, 540 - cam.x * cam.z, 960 - cam.y * cam.z);
  drawLabels(ctx, t);
  drawPaths(ctx, t);
  drawTower(ctx, t);
  drawPlant(ctx, t);
  drawBowlBack(ctx, t);
  drawBed(ctx, t);
  const g = girlState(t), J = jeroState(t), hugging = t >= TT.leap[0] && t < TT.hopOut[1];
  const jBehind = t >= TT.orbit[0] && t < TT.orbit[1] && (J.gy === null ? J.fy : J.gy) < g.fy + g.jump;   // 깊이 순서
  if (jBehind) { drawJero(ctx, J, t); drawGirl(ctx, g, t, false); } else { drawGirl(ctx, g, t, false); drawJero(ctx, J, t); }
  drawBowlFront(ctx, t);
  if (hugging) { g.hugLift = (t >= TT.hugHold[0] ? 24 * smooth(seg(t, TT.hugHold[0], TT.hugHold[1] - 0.7)) : 0); drawGirl(ctx, g, t, true); }
  drawFx(ctx, t);
  drawChecks(ctx, t);
  drawVignette(ctx);
}

const canvas = document.getElementById('c'), ctx = canvas.getContext('2d');
const tmp = document.createElement('canvas'); tmp.width = CONFIG.W; tmp.height = CONFIG.H; const tctx = tmp.getContext('2d');
function render(t) {
  const D = CONFIG.DURATION; t = ((t % D) + D) % D;
  const cam = camAt(t);
  if (cam.whoosh && cam.speed > 500) {      // 휙 넘어가는 순간에만 모션 블러
    const n = 5, shutter = Math.min(0.07, cam.speed / 20000 + 0.02);
    for (let k = 0; k < n; k++) {
      scene(tctx, Math.max(0, t - k * shutter / n));
      if (k === 0) { ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = 1; ctx.drawImage(tmp, 0, 0); }
      else { ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = 1 / (k + 1); ctx.drawImage(tmp, 0, 0); }
    }
    ctx.globalAlpha = 1;
  } else scene(ctx, t);
}
window.render = render;

/* =====================================================================
   재생 막대 · 창 크기에 맞추기
   ===================================================================== */
const playBtn = document.getElementById('play'), seek = document.getElementById('seek'), bar = document.getElementById('bar');
seek.max = CONFIG.DURATION;
let playing = true, clock = 0, last = performance.now();
function fit() {
  const availH = innerHeight - 52, s = Math.min(innerWidth / CONFIG.W, availH / CONFIG.H);
  canvas.style.width = Math.floor(CONFIG.W * s) + 'px'; canvas.style.height = Math.floor(CONFIG.H * s) + 'px'; bar.style.width = canvas.style.width;
}
addEventListener('resize', fit); fit();
playBtn.onclick = () => { playing = !playing; playBtn.textContent = playing ? '❚❚' : '▶'; last = performance.now(); };
seek.addEventListener('input', () => { clock = parseFloat(seek.value); render(clock); });
function frame(now) {
  if (playing) { clock = (clock + (now - last) / 1000) % CONFIG.DURATION; seek.value = clock; render(clock); }
  last = now; requestAnimationFrame(frame);
}
const fixed = /[#&]t=([\d.]+)/.exec(location.hash);
buildDoodleTile();
function start() {
  if (fixed) { playing = false; playBtn.textContent = '▶'; clock = parseFloat(fixed[1]); seek.value = clock; render(clock); }
  else { last = performance.now(); requestAnimationFrame(frame); }
  window.__ready = true;
}
Promise.race([document.fonts.load(fontStr(80), '귀여운 고양이 제로'), new Promise(r => setTimeout(r, 2500))]).then(start, start);
